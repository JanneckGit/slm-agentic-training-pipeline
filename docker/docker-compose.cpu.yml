# docker/docker-compose.cpu.yml — override for GPU-FREE runs of the training service (the test runner).
# Stack it on the main file:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.cpu.yml run --rm -T training …
#
# `deploy` on the training service holds nothing but the GPU reservation -> !reset removes it. Docker's
# default runtime on this box is runc, so no device request = no GPU, whatever the NGC image's
# NVIDIA_VISIBLE_DEVICES=all says. The two env vars are the belt-and-braces layer: even if a runtime ever
# attached the device, torch could not see it. The shared GPU is never touched by a test run
# (ops/run_tests.sh additionally refuses to run the test if torch.cuda.is_available() is True).
# Training / eval / SDG keep using the main file alone — with the GPU.
services:
  training:
    deploy: !reset {}
    environment:
      - NVIDIA_VISIBLE_DEVICES=void
      - CUDA_VISIBLE_DEVICES=
